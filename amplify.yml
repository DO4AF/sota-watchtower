version: 1
applications:
  - appRoot: web
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npx ng build --configuration production
      artifacts:
        baseDirectory: dist/sota-watchtower-web/browser
        files:
          - '**/*'
      cache:
        paths:
          - 'node_modules/**/*'
