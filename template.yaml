Transform: AWS::Serverless-2016-10-31
Parameters:
  TelegramBotToken:
    Description: Bot Token for Telegram
    Type: String
  TelegramUserChatId:
    Description: User Chat ID for Telegram
    Type: String
  TelegramGroupChatId:
    Description: Group Chat ID for Telegram
    Type: String
  FrequencyFilterPattern:
    Description: Frequency pattern to filter Alerts
    Type: String
  AdminEmail:
    Description: E-mail address for the initial web-UI admin user (Cognito)
    Type: String
  AdminPassword:
    Description: Initial password for the web-UI admin user (min 8 chars,
      upper+lower+number+symbol)
    Type: String
    NoEcho: true
Resources:
  HamAlertApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub
        - ${ResourceName} From Stack ${AWS::StackName}
        - ResourceName: HamAlertApi
      StageName: Prod
      DefinitionBody:
        openapi: '3.0'
        info: {}
        paths:
          /notify:
            post:
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${HamAlertProcessFunction.Arn}/invocations
              responses: {}
      EndpointConfiguration: REGIONAL
      TracingEnabled: true
      Cors:
        MaxAge: 5
  HamAlertProcessFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: HamAlertProcessFunction
      Description: !Sub
        - Stack ${AWS::StackName} Function ${ResourceName}
        - ResourceName: HamAlertProcessFunction
      CodeUri: src/HamAlertProcessFunction
      Handler: handler.handler
      Runtime: python3.13
      MemorySize: 3008
      Timeout: 30
      Tracing: Active
      Events:
        HamAlertApiPOSTnotify:
          Type: Api
          Properties:
            Path: /notify
            Method: POST
            RestApiId: !Ref HamAlertApi
      Environment:
        Variables:
          TELEGRAM_GROUP_ID: !Ref TelegramGroupChatId
          TELEGRAM_USER_ID: !Ref TelegramUserChatId
          TELEGRAMNOTIFYFUNCTION_FUNCTION_NAME: !Ref TelegramNotifyFunction
          TELEGRAMNOTIFYFUNCTION_FUNCTION_ARN: !GetAtt TelegramNotifyFunction.Arn
          CONFIGTABLE_TABLE_NAME: !Ref ConfigTable
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref TelegramNotifyFunction
        - DynamoDBReadPolicy:
            TableName: !Ref ConfigTable
      LoggingConfig:
        LogFormat: Text
        LogGroup: !Ref SotaWatchtowerMasterLogGroup
  RequestsLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      Description: !Sub
        - Stack ${AWS::StackName} Layer ${ResourceName}
        - ResourceName: RequestsLayer
      ContentUri: src/RequestsLayer
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: python3.13
  GetSotaAlertsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: GetSotaAlertsFunction
      Description: !Sub
        - Stack ${AWS::StackName} Function ${ResourceName}
        - ResourceName: GetSotaAlertsFunction
      CodeUri: src/GetSotaAlertsFunction
      Handler: handler.handler
      Runtime: python3.13
      MemorySize: 3008
      Timeout: 30
      Tracing: Active
      Layers:
        - !Ref RequestsLayer
      Events:
        SotaAlertsRefresh:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Description: Refresh SOTA alerts table every 5 minutes
      Environment:
        Variables:
          FREQUENCY_FILTER_PATTERN: !Ref FrequencyFilterPattern
          SOTAALERTSTABLE_TABLE_NAME: !Ref SotaAlertsTable
          SOTAALERTSTABLE_TABLE_ARN: !GetAtt SotaAlertsTable.Arn
          CONFIGTABLE_TABLE_NAME: !Ref ConfigTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SotaAlertsTable
        - DynamoDBReadPolicy:
            TableName: !Ref ConfigTable
      LoggingConfig:
        LogFormat: Text
        LogGroup: !Ref SotaWatchtowerMasterLogGroup
  DailyBriefingFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: DailyBriefingFunction
      Description: !Sub
        - Stack ${AWS::StackName} Function ${ResourceName}
        - ResourceName: DailyBriefingFunction
      CodeUri: src/DailyBriefingFunction
      Handler: handler.handler
      Runtime: python3.13
      MemorySize: 3008
      Timeout: 30
      Tracing: Active
      Environment:
        Variables:
          TELEGRAM_GROUP_ID: !Ref TelegramGroupChatId
          GETSOTAALERTSFUNCTION_FUNCTION_NAME: !Ref GetSotaAlertsFunction
          GETSOTAALERTSFUNCTION_FUNCTION_ARN: !GetAtt GetSotaAlertsFunction.Arn
          TELEGRAMNOTIFYFUNCTION_FUNCTION_NAME: !Ref TelegramNotifyFunction
          TELEGRAMNOTIFYFUNCTION_FUNCTION_ARN: !GetAtt TelegramNotifyFunction.Arn
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref GetSotaAlertsFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref TelegramNotifyFunction
      LoggingConfig:
        LogFormat: Text
        LogGroup: !Ref SotaWatchtowerMasterLogGroup
  TelegramNotifyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TelegramNotifyFunction
      Description: !Sub
        - Stack ${AWS::StackName} Function ${ResourceName}
        - ResourceName: TelegramNotifyFunction
      CodeUri: src/TelegramNotifyFunction
      Handler: handler.handler
      Runtime: python3.13
      MemorySize: 3008
      Timeout: 30
      Tracing: Active
      Layers:
        - !Ref RequestsLayer
      Environment:
        Variables:
          TELEGRAM_BOT_TOKEN: !Ref TelegramBotToken
          CONFIGTABLE_TABLE_NAME: !Ref ConfigTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ConfigTable
      LoggingConfig:
        LogFormat: Text
        LogGroup: !Ref SotaWatchtowerMasterLogGroup
  GetSotaSpotsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: GetSotaSpotsFunction
      Description: !Sub
        - Stack ${AWS::StackName} Function ${ResourceName}
        - ResourceName: GetSotaSpotsFunction
      CodeUri: src/GetSotaSpotsFunction
      Handler: handler.handler
      Runtime: python3.13
      MemorySize: 3008
      Timeout: 30
      Tracing: Active
      Layers:
        - !Ref RequestsLayer
      Environment:
        Variables:
          CONFIGTABLE_TABLE_NAME: !Ref ConfigTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ConfigTable
      LoggingConfig:
        LogFormat: Text
        LogGroup: !Ref SotaWatchtowerMasterLogGroup
  ActivationZoneMonitorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ActivationZoneMonitorFunction
      Description: !Sub
        - Stack ${AWS::StackName} Function ${ResourceName}
        - ResourceName: ActivationZoneMonitorFunction
      CodeUri: src/ActivationZoneMonitorFunction
      Handler: handler.handler
      Runtime: python3.13
      MemorySize: 3008
      Timeout: 30
      Tracing: Active
      Environment:
        Variables:
          TELEGRAM_GROUP_ID: !Ref TelegramGroupChatId
          GETSOTAALERTSFUNCTION_FUNCTION_NAME: !Ref GetSotaAlertsFunction
          GETSOTAALERTSFUNCTION_FUNCTION_ARN: !GetAtt GetSotaAlertsFunction.Arn
          GETSOTASPOTSFUNCTION_FUNCTION_NAME: !Ref GetSotaSpotsFunction
          GETSOTASPOTSFUNCTION_FUNCTION_ARN: !GetAtt GetSotaSpotsFunction.Arn
          SOTAALERTSTABLE_TABLE_NAME: !Ref SotaAlertsTable
          SOTAALERTSTABLE_TABLE_ARN: !GetAtt SotaAlertsTable.Arn
          TELEGRAMNOTIFYFUNCTION_FUNCTION_NAME: !Ref TelegramNotifyFunction
          TELEGRAMNOTIFYFUNCTION_FUNCTION_ARN: !GetAtt TelegramNotifyFunction.Arn
          WEBSOCKETBROADCASTFUNCTION_FUNCTION_ARN: !GetAtt WebSocketBroadcastFunction.Arn
          APRSPOSITIONSTABLE_TABLE_NAME: !Ref AprsPositionsTable
          CONFIGTABLE_TABLE_NAME: !Ref ConfigTable
      Layers:
        - !Ref RequestsLayer
        - !Ref GeopyLayer
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref GetSotaAlertsFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref GetSotaSpotsFunction
        - DynamoDBCrudPolicy:
            TableName: !Ref SotaAlertsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AprsPositionsTable
        - DynamoDBReadPolicy:
            TableName: !Ref ConfigTable
        - LambdaInvokePolicy:
            FunctionName: !Ref TelegramNotifyFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref WebSocketBroadcastFunction
      LoggingConfig:
        LogFormat: Text
        LogGroup: !Ref SotaWatchtowerMasterLogGroup
  GeopyLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      Description: !Sub
        - Stack ${AWS::StackName} Layer ${ResourceName}
        - ResourceName: GeopyLayer
      ContentUri: src/GeopyLayer
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: python3.13
  SotaAlertsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: callsign
          AttributeType: S
        - AttributeName: summit
          AttributeType: S
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: callsign
          KeyType: HASH
        - AttributeName: summit
          KeyType: RANGE
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      TimeToLiveSpecification:
        AttributeName: expiration
        Enabled: true
  AprsMonitorInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro
      ImageId: ami-0e872aee57663ae2d
      IamInstanceProfile: !Ref AprsMonitorInstanceProfile
      SecurityGroupIds:
        - !Ref AprsMonitorSecurityGroup
      UserData: !Base64
        Fn::Sub: |
          #!/bin/bash
          echo "ACTIVATIONZONEMONITORFUNCTION_FUNCTION_ARN=${ActivationZoneMonitorFunction.Arn}" >> /etc/profile
          echo "ACTIVATIONZONEMONITORFUNCTION_FUNCTION_ARN=${ActivationZoneMonitorFunction.Arn}" >> /etc/environment
          echo "CONFIGTABLE_TABLE_NAME=${ConfigTable}" >> /etc/profile
          echo "CONFIGTABLE_TABLE_NAME=${ConfigTable}" >> /etc/environment
          echo "AWS_REGION=${AWS::Region}" >> /etc/profile
          echo "AWS_REGION=${AWS::Region}" >> /etc/environment
          # Install necessary packages
          sudo apt-get update
          sudo apt-get upgrade -y
          sudo apt-get install -y git htop
          # Clone the GitHub repository
          cd /home/ubuntu/
          git clone https://github.com/DO4AF/sota-watchtower.git
          # Change ownership of the cloned repository to the 'ubuntu' user
          sudo chown -R ubuntu:ubuntu /home/ubuntu/sota-watchtower
          # Set permissions to 777 (note: this is very permissive, consider using 755 or 775 instead)
          sudo chmod -R 777 /home/ubuntu/sota-watchtower
          # Run the UserData script from the repository
          cd /home/ubuntu/sota-watchtower/ec2/aprs-listener/
          sudo chmod +x install.sh
          ./install.sh
      Tags:
        - Key: Name
          Value: SotaWatchtower-AprsMonitor
  AprsMonitorSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow SSH and HTTP access
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
  AprsMonitorInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref AprsMonitorInstanceRole
  AprsMonitorInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: EC2InvokeLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !GetAtt ActivationZoneMonitorFunction.Arn
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Scan
                Resource: !GetAtt ConfigTable.Arn
  SotaWatchtowerMasterLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /sotawatchtower/MasterLogGroup
      RetentionInDays: 90
  SotaWatchtowerDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardBody: !Sub |
        {
          "start": "-PT72H",
          "widgets": [
              {
                  "height": 10,
                  "width": 10,
                  "y": 0,
                  "x": 13,
                  "type": "metric",
                  "properties": {
                      "metrics": [
                          [ "AWS/Lambda", "Invocations", "FunctionName", "ActivationZoneMonitorFunction" ]
                      ],
                      "view": "timeSeries",
                      "stacked": false,
                      "region": "eu-central-1",
                      "period": 3600,
                      "stat": "Sum",
                      "title": "Invocations",
                      "annotations": {
                          "horizontal": [
                              [
                                  {
                                      "color": "#f89256",
                                      "label": "Medium load",
                                      "value": 200
                                  },
                                  {
                                      "value": 400,
                                      "label": "Medium load"
                                  }
                              ],
                              {
                                  "color": "#fe6e73",
                                  "label": "High load",
                                  "value": 400,
                                  "fill": "above"
                              }
                          ]
                      },
                      "yAxis": {
                          "left": {
                              "min": 0,
                              "label": ""
                          }
                      },
                      "liveData": false
                  }
              },
              {
                  "height": 11,
                  "width": 23,
                  "y": 10,
                  "x": 0,
                  "type": "log",
                  "properties": {
                      "query": "SOURCE '/sotawatchtower/MasterLogGroup' | fields @timestamp, @message\n| sort @timestamp desc\n| limit 10000\n| filter @message like /APRS Callsign: .*, APRS Latitude: .*, APRS Longitude: .*, APRS Altitude: /",
                      "region": "eu-central-1",
                      "stacked": false,
                      "title": "APRS data stream",
                      "view": "table"
                  }
              },
              {
                  "height": 7,
                  "width": 6,
                  "y": 0,
                  "x": 0,
                  "type": "metric",
                  "properties": {
                      "metrics": [
                          [ "AWS/Lambda", "Invocations", "FunctionName", "ActivationZoneMonitorFunction" ]
                      ],
                      "view": "gauge",
                      "region": "eu-central-1",
                      "yAxis": {
                          "left": {
                              "min": 0,
                              "max": 500
                          }
                      },
                      "stat": "Sum",
                      "period": 3600,
                      "title": "Callsigns per hour",
                      "annotations": {
                          "horizontal": [
                              {
                                  "color": "#fe6e73",
                                  "label": "High load",
                                  "value": 400,
                                  "fill": "above"
                              },
                              [
                                  {
                                      "color": "#f89256",
                                      "label": "Medium load",
                                      "value": 200
                                  },
                                  {
                                      "value": 400,
                                      "label": "Medium load"
                                  }
                              ]
                          ]
                      },
                      "liveData": false,
                      "singleValueFullPrecision": false
                  }
              },
              {
                  "height": 7,
                  "width": 7,
                  "y": 0,
                  "x": 6,
                  "type": "log",
                  "properties": {
                      "query": "SOURCE '/sotawatchtower/MasterLogGroup' | fields @timestamp, @message, @logStream, @log\n| sort @timestamp desc\n| limit 10000\n| filter @message like /APRS Callsign: .*, APRS Latitude: .*, APRS Longitude: .*, APRS Altitude: /\n| parse @message /APRS Callsign: (?<callsign>[^,]+), APRS Latitude/\n| stats \n    count(if(callsign like /^D.*/, 1, null)) as D_Callsigns,\n    count(if(callsign like /^OE.*/, 1, null)) as OE_Callsigns,\n    count(if(!(callsign like /^D.*/ or callsign like /^OE.*/), 1, null)) as Other_Callsigns\n",
                      "region": "eu-central-1",
                      "stacked": false,
                      "title": "Country",
                      "view": "bar"
                  }
              },
              {
                  "height": 3,
                  "width": 6,
                  "y": 7,
                  "x": 0,
                  "type": "log",
                  "properties": {
                      "query": "SOURCE '/sotawatchtower/MasterLogGroup' | fields @timestamp, @message\n| parse @message /APRS Callsign: (?<callsign>[^,]+), APRS Latitude: [^,]+, APRS Longitude: [^,]+, APRS Altitude: [^,]+/ \n| display @timestamp, callsign\n| sort @timestamp desc\n| limit 1\n| filter @message like /APRS Callsign: .*, APRS Latitude: .*, APRS Longitude: .*, APRS Altitude: /",
                      "region": "eu-central-1",
                      "stacked": false,
                      "title": "Last callsign",
                      "view": "table"
                  }
              },
              {
                  "height": 3,
                  "width": 7,
                  "y": 7,
                  "x": 6,
                  "type": "alarm",
                  "properties": {
                      "title": "APRS Signal Health",
                      "alarms": [
                          "${AprsMonitorAlarm.Arn}"
                      ]
                  }
              }
          ]
        }
      DashboardName: SOTA-Watchtower-Dashboard
  AprsMonitorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: APRS Signal alive
      ActionsEnabled: true
      OKActions: []
      AlarmActions: []
      InsufficientDataActions: []
      MetricName: Invocations
      Namespace: AWS/Lambda
      Statistic: Sum
      Dimensions:
        - Name: FunctionName
          Value: ActivationZoneMonitorFunction
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: LessThanOrEqualToThreshold
      TreatMissingData: breaching

  # ─── APRS Positions Table ────────────────────────────────────────────────────
  AprsPositionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: callsign
          AttributeType: S
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: callsign
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ─── Web UI: DynamoDB Tables ────────────────────────────────────────────────
  ConfigTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: configKey
          AttributeType: S
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: configKey
          KeyType: HASH

  WebSocketConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: connectionId
          AttributeType: S
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: connectionId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ─── Summits Table (populated daily by RefreshSummitsFunction) ──────────────
  SummitsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: summitCode
          AttributeType: S
        - AttributeName: association
          AttributeType: S
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: summitCode
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: AssociationIndex
          KeySchema:
            - AttributeName: association
              KeyType: HASH
            - AttributeName: summitCode
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # ─── Web UI: Cognito ─────────────────────────────────────────────────────────
  WatchtowerUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub ${AWS::StackName}-WatchtowerUserPool
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true

  WatchtowerUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: WatchtowerWebClient
      UserPoolId: !Ref WatchtowerUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      SupportedIdentityProviders:
        - COGNITO

  # ─── Web UI: REST API ────────────────────────────────────────────────────────
  WatchtowerWebApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub
        - ${ResourceName} From Stack ${AWS::StackName}
        - ResourceName: WatchtowerWebApi
      StageName: Prod
      EndpointConfiguration: REGIONAL
      TracingEnabled: true
      Cors:
        AllowOrigin: '''*'''
        AllowHeaders: '''Authorization,Content-Type'''
        AllowMethods: '''GET,PUT,OPTIONS'''
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt WatchtowerUserPool.Arn

  WatchtowerWebApiGatewayResponseDefault4xx:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref WatchtowerWebApi
      ResponseType: DEFAULT_4XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Authorization,Content-Type'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,PUT,OPTIONS'"

  WatchtowerWebApiGatewayResponseDefault5xx:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref WatchtowerWebApi
      ResponseType: DEFAULT_5XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Authorization,Content-Type'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,PUT,OPTIONS'"

  WatchtowerWebApiGatewayResponseUnauthorized:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref WatchtowerWebApi
      ResponseType: UNAUTHORIZED
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Authorization,Content-Type'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,PUT,OPTIONS'"

  WatchtowerWebApiGatewayResponseAccessDenied:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref WatchtowerWebApi
      ResponseType: ACCESS_DENIED
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Authorization,Content-Type'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,PUT,OPTIONS'"

  WatchtowerWebApiGatewayResponseIntegrationTimeout:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref WatchtowerWebApi
      ResponseType: INTEGRATION_TIMEOUT
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Authorization,Content-Type'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,PUT,OPTIONS'"

  WatchtowerWebApiGatewayResponseIntegrationFailure:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref WatchtowerWebApi
      ResponseType: INTEGRATION_FAILURE
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Authorization,Content-Type'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,PUT,OPTIONS'"

  GetAprsPositionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: GetAprsPositionsFunction
      Description: !Sub
        - Stack ${AWS::StackName} Function ${ResourceName}
        - ResourceName: GetAprsPositionsFunction
      CodeUri: src/GetAprsPositionsFunction
      Handler: handler.handler
      Runtime: python3.13
      MemorySize: 512
      Timeout: 30
      Tracing: Active
      Events:
        GetAprsPositions:
          Type: Api
          Properties:
            Path: /aprs-positions
            Method: GET
            RestApiId: !Ref WatchtowerWebApi
            Auth:
              Authorizer: NONE
      Environment:
        Variables:
          APRSPOSITIONSTABLE_TABLE_NAME: !Ref AprsPositionsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref AprsPositionsTable
      LoggingConfig:
        LogFormat: Text
        LogGroup: !Ref SotaWatchtowerMasterLogGroup

  GetSummitsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: GetSummitsFunction
      Description: !Sub
        - Stack ${AWS::StackName} Function ${ResourceName}
        - ResourceName: GetSummitsFunction
      CodeUri: src/GetSummitsFunction
      Handler: handler.handler
      Runtime: python3.13
      MemorySize: 512
      Timeout: 30
      Tracing: Active
      Events:
        GetSummits:
          Type: Api
          Properties:
            Path: /summits
            Method: GET
            RestApiId: !Ref WatchtowerWebApi
            Auth:
              Authorizer: NONE
      Environment:
        Variables:
          SUMMITS_TABLE_NAME: !Ref SummitsTable
          CONFIGTABLE_TABLE_NAME: !Ref ConfigTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SummitsTable
        - DynamoDBReadPolicy:
            TableName: !Ref ConfigTable
      LoggingConfig:
        LogFormat: Text
        LogGroup: !Ref SotaWatchtowerMasterLogGroup

  # ─── S3 Bucket for static summit GeoJSON (public-read, CORS-enabled) ──────────
  SummitsBucket:
    Type: AWS::S3::Bucket
    Properties:
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - GET
            AllowedOrigins:
              - '*'
            MaxAge: 86400
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  SummitsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SummitsBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub arn:aws:s3:::${SummitsBucket}/*

  RefreshSummitsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: RefreshSummitsFunction
      Description: !Sub
        - Stack ${AWS::StackName} Function ${ResourceName}
        - ResourceName: RefreshSummitsFunction
      CodeUri: src/RefreshSummitsFunction
      Handler: handler.handler
      Runtime: python3.13
      MemorySize: 512
      Timeout: 300
      Tracing: Active
      Events:
        DailyRefresh:
          Type: Schedule
          Properties:
            Schedule: cron(0 2 * * ? *)
            Description: Refresh SOTA summits database daily at 02:00 UTC
      Environment:
        Variables:
          SUMMITS_TABLE_NAME: !Ref SummitsTable
          SUMMITS_BUCKET_NAME: !Ref SummitsBucket
          CONFIGTABLE_TABLE_NAME: !Ref ConfigTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SummitsTable
        - DynamoDBReadPolicy:
            TableName: !Ref ConfigTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConfigTable
        - S3WritePolicy:
            BucketName: !Ref SummitsBucket
      LoggingConfig:
        LogFormat: Text
        LogGroup: !Ref SotaWatchtowerMasterLogGroup

  GetAlertsWebFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: GetAlertsWebFunction
      Description: !Sub
        - Stack ${AWS::StackName} Function ${ResourceName}
        - ResourceName: GetAlertsWebFunction
      CodeUri: src/GetAlertsWebFunction
      Handler: handler.handler
      Runtime: python3.13
      MemorySize: 512
      Timeout: 60
      Tracing: Active
      Events:
        GetAlerts:
          Type: Api
          Properties:
            Path: /alerts
            Method: GET
            RestApiId: !Ref WatchtowerWebApi
      Environment:
        Variables:
          SOTAALERTSTABLE_TABLE_NAME: !Ref SotaAlertsTable
          SUMMITS_TABLE_NAME: !Ref SummitsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SotaAlertsTable
        - DynamoDBReadPolicy:
            TableName: !Ref SummitsTable
      LoggingConfig:
        LogFormat: Text
        LogGroup: !Ref SotaWatchtowerMasterLogGroup

  GetSpotsWebFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: GetSpotsWebFunction
      Description: !Sub
        - Stack ${AWS::StackName} Function ${ResourceName}
        - ResourceName: GetSpotsWebFunction
      CodeUri: src/GetSpotsWebFunction
      Handler: handler.handler
      Runtime: python3.13
      MemorySize: 512
      Timeout: 60
      Tracing: Active
      Layers:
        - !Ref RequestsLayer
      Events:
        GetSpots:
          Type: Api
          Properties:
            Path: /spots
            Method: GET
            RestApiId: !Ref WatchtowerWebApi
      Environment:
        Variables:
          CONFIGTABLE_TABLE_NAME: !Ref ConfigTable
          SUMMITS_TABLE_NAME: !Ref SummitsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ConfigTable
        - DynamoDBReadPolicy:
            TableName: !Ref SummitsTable
      LoggingConfig:
        LogFormat: Text
        LogGroup: !Ref SotaWatchtowerMasterLogGroup

  GetConfigFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: GetConfigFunction
      Description: !Sub
        - Stack ${AWS::StackName} Function ${ResourceName}
        - ResourceName: GetConfigFunction
      CodeUri: src/GetConfigFunction
      Handler: handler.handler
      Runtime: python3.13
      MemorySize: 512
      Timeout: 30
      Tracing: Active
      Events:
        GetConfig:
          Type: Api
          Properties:
            Path: /config
            Method: GET
            RestApiId: !Ref WatchtowerWebApi
      Environment:
        Variables:
          CONFIGTABLE_TABLE_NAME: !Ref ConfigTable
          SUMMITS_TABLE_NAME: !Ref SummitsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ConfigTable
        - DynamoDBReadPolicy:
            TableName: !Ref SummitsTable
      LoggingConfig:
        LogFormat: Text
        LogGroup: !Ref SotaWatchtowerMasterLogGroup

  PutConfigFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: PutConfigFunction
      Description: !Sub
        - Stack ${AWS::StackName} Function ${ResourceName}
        - ResourceName: PutConfigFunction
      CodeUri: src/PutConfigFunction
      Handler: handler.handler
      Runtime: python3.13
      MemorySize: 512
      Timeout: 30
      Tracing: Active
      Events:
        PutConfig:
          Type: Api
          Properties:
            Path: /config
            Method: PUT
            RestApiId: !Ref WatchtowerWebApi
      Environment:
        Variables:
          CONFIGTABLE_TABLE_NAME: !Ref ConfigTable
          APRSPOSITIONSTABLE_TABLE_NAME: !Ref AprsPositionsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ConfigTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AprsPositionsTable
      LoggingConfig:
        LogFormat: Text
        LogGroup: !Ref SotaWatchtowerMasterLogGroup

  # ─── Web UI: WebSocket API ───────────────────────────────────────────────────
  WatchtowerWsApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub ${AWS::StackName}-WatchtowerWsApi
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: $request.body.action

  WatchtowerWsConnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WatchtowerWsApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebSocketConnectFunction.Arn}/invocations

  WatchtowerWsDisconnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WatchtowerWsApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebSocketDisconnectFunction.Arn}/invocations

  WatchtowerWsConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WatchtowerWsApi
      RouteKey: $connect
      AuthorizationType: NONE
      Target: !Sub integrations/${WatchtowerWsConnectIntegration}

  WatchtowerWsDisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WatchtowerWsApi
      RouteKey: $disconnect
      AuthorizationType: NONE
      Target: !Sub integrations/${WatchtowerWsDisconnectIntegration}

  WatchtowerWsDeployment:
    Type: AWS::ApiGatewayV2::Deployment
    DependsOn:
      - WatchtowerWsConnectRoute
      - WatchtowerWsDisconnectRoute
    Properties:
      ApiId: !Ref WatchtowerWsApi

  WatchtowerWsStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WatchtowerWsApi
      DeploymentId: !Ref WatchtowerWsDeployment
      StageName: Prod

  WebSocketConnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: WebSocketConnectFunction
      Description: !Sub
        - Stack ${AWS::StackName} Function ${ResourceName}
        - ResourceName: WebSocketConnectFunction
      CodeUri: src/WebSocketConnectFunction
      Handler: handler.handler
      Runtime: python3.13
      MemorySize: 256
      Timeout: 10
      Tracing: Active
      Environment:
        Variables:
          WEBSOCKETCONNECTIONSTABLE_TABLE_NAME: !Ref WebSocketConnectionsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref WebSocketConnectionsTable
      LoggingConfig:
        LogFormat: Text
        LogGroup: !Ref SotaWatchtowerMasterLogGroup

  WebSocketConnectFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WebSocketConnectFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WatchtowerWsApi}/*/$connect

  WebSocketDisconnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: WebSocketDisconnectFunction
      Description: !Sub
        - Stack ${AWS::StackName} Function ${ResourceName}
        - ResourceName: WebSocketDisconnectFunction
      CodeUri: src/WebSocketDisconnectFunction
      Handler: handler.handler
      Runtime: python3.13
      MemorySize: 256
      Timeout: 10
      Tracing: Active
      Environment:
        Variables:
          WEBSOCKETCONNECTIONSTABLE_TABLE_NAME: !Ref WebSocketConnectionsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref WebSocketConnectionsTable
      LoggingConfig:
        LogFormat: Text
        LogGroup: !Ref SotaWatchtowerMasterLogGroup

  WebSocketDisconnectFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WebSocketDisconnectFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WatchtowerWsApi}/*/$disconnect

  WebSocketBroadcastFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: WebSocketBroadcastFunction
      Description: !Sub
        - Stack ${AWS::StackName} Function ${ResourceName}
        - ResourceName: WebSocketBroadcastFunction
      CodeUri: src/WebSocketBroadcastFunction
      Handler: handler.handler
      Runtime: python3.13
      MemorySize: 512
      Timeout: 30
      Tracing: Active
      Events:
        SotaAlertsStream:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt SotaAlertsTable.StreamArn
            StartingPosition: LATEST
            BatchSize: 10
            FilterCriteria:
              Filters:
                - Pattern: '{"eventName": ["INSERT", "MODIFY"]}'
      Environment:
        Variables:
          WEBSOCKETCONNECTIONSTABLE_TABLE_NAME: !Ref WebSocketConnectionsTable
          WS_API_ENDPOINT: !Sub https://${WatchtowerWsApi}.execute-api.${AWS::Region}.amazonaws.com/Prod
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref WebSocketConnectionsTable
        - Statement:
            - Effect: Allow
              Action: execute-api:ManageConnections
              Resource: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WatchtowerWsApi}/*
      LoggingConfig:
        LogFormat: Text
        LogGroup: !Ref SotaWatchtowerMasterLogGroup

  # ─── Web UI: Config Seeding (Custom Resource) ────────────────────────────────
  SeedConfigFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: SeedConfigFunction
      Description: !Sub
        - Stack ${AWS::StackName} Function ${ResourceName}
        - ResourceName: SeedConfigFunction
      CodeUri: src/SeedConfigFunction
      Handler: handler.handler
      Runtime: python3.13
      MemorySize: 256
      Timeout: 60
      Tracing: Active
      Environment:
        Variables:
          CONFIGTABLE_TABLE_NAME: !Ref ConfigTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ConfigTable
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminSetUserPassword
              Resource: !GetAtt WatchtowerUserPool.Arn
      LoggingConfig:
        LogFormat: Text
        LogGroup: !Ref SotaWatchtowerMasterLogGroup

  SeedConfigCustomResource:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !GetAtt SeedConfigFunction.Arn
      ConfigTableName: !Ref ConfigTable
      TelegramBotToken: !Ref TelegramBotToken
      TelegramGroupId: !Ref TelegramGroupChatId
      TelegramUserId: !Ref TelegramUserChatId
      FrequencyFilterPattern: !Ref FrequencyFilterPattern
      UserPoolId: !Ref WatchtowerUserPool
      AdminEmail: !Ref AdminEmail
      AdminPassword: !Ref AdminPassword

Outputs:
  ApiGatewayInvokeUrl:
    Description: URL to enter into HamAlert Destination
    Value: !Sub https://${HamAlertApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/notify
    Export:
      Name: !Sub ${AWS::StackName}-ApiGatewayInvokeUrl
  DashboardUrl:
    Description: URL to the CloudWatch Dashboard
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards/dashboard/${SotaWatchtowerDashboard}
  WatchtowerWebApiUrl:
    Description: Base URL for the Watchtower REST API
    Value: !Sub https://${WatchtowerWebApi}.execute-api.${AWS::Region}.amazonaws.com/Prod
    Export:
      Name: !Sub ${AWS::StackName}-WatchtowerWebApiUrl
  WatchtowerWsApiUrl:
    Description: WebSocket URL for real-time updates
    Value: !Sub wss://${WatchtowerWsApi}.execute-api.${AWS::Region}.amazonaws.com/Prod
    Export:
      Name: !Sub ${AWS::StackName}-WatchtowerWsApiUrl
  CognitoUserPoolId:
    Description: Cognito User Pool ID for the web UI
    Value: !Ref WatchtowerUserPool
    Export:
      Name: !Sub ${AWS::StackName}-CognitoUserPoolId
  CognitoClientId:
    Description: Cognito App Client ID for the web UI
    Value: !Ref WatchtowerUserPoolClient
    Export:
      Name: !Sub ${AWS::StackName}-CognitoClientId
  DashboardUrlExport:
    Description: URL to the CloudWatch Dashboard (export)
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards/dashboard/${SotaWatchtowerDashboard}
    Export:
      Name: !Sub ${AWS::StackName}-DashboardUrl
  SummitsBucketUrl:
    Description: Public URL for the static worldwide summits GeoJSON file
    Value: !Sub https://${SummitsBucket}.s3.${AWS::Region}.amazonaws.com/summits.json
    Export:
      Name: !Sub ${AWS::StackName}-SummitsBucketUrl