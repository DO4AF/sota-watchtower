<div class="app-layout" [class.sidebar-collapsed]="sidebarCollapsed">
  <!-- Left Sidebar -->
  <aside class="sidebar">
    <button class="sidebar__brand" (click)="toggleSidebar()" title="Toggle sidebar">
      <i class="pi pi-globe sidebar__brand-icon"></i>
      <span class="sidebar__brand-name">SOTA Watchtower</span>
    </button>

    <nav class="sidebar__nav">
      <a routerLink="/map" routerLinkActive="active" class="sidebar__nav-item" title="Map">
        <i class="pi pi-map sidebar__nav-icon"></i>
        <span class="sidebar__nav-label">Map</span>
      </a>
      <a routerLink="/alerts" routerLinkActive="active" class="sidebar__nav-item" title="Alerts">
        <i class="pi pi-bell sidebar__nav-icon"></i>
        <span class="sidebar__nav-label">Alerts</span>
      </a>
      <a routerLink="/log" routerLinkActive="active" class="sidebar__nav-item" title="Event Log">
        <i class="pi pi-list sidebar__nav-icon"></i>
        <span class="sidebar__nav-label">Event Log</span>
      </a>
      <a routerLink="/config" routerLinkActive="active" class="sidebar__nav-item" title="Config">
        <i class="pi pi-cog sidebar__nav-icon"></i>
        <span class="sidebar__nav-label">Config</span>
      </a>
    </nav>

    <div class="sidebar__footer">
      <button class="sidebar__footer-btn" (click)="logout()" title="Sign out">
        <i class="pi pi-sign-out sidebar__nav-icon"></i>
        <span class="sidebar__nav-label">Sign out</span>
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <router-outlet />
  </main>
</div>
