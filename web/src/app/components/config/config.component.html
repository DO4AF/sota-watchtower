<p-toast />

<div class="config-page" (change)="onFormChange()">
  @if (loading()) {
    <div class="config-loading">Loading configuration…</div>
  } @else {
    <form (ngSubmit)="save()" (keyup)="onFormChange()" (change)="onFormChange()">
      <!-- Filters -->
      <p-card header="Filters" styleClass="config-card">
        <div class="field">
          <label for="freqPattern">Frequency filter pattern (regex)</label>
          <input
            id="freqPattern"
            pInputText
            [(ngModel)]="frequencyFilterPattern"
            name="freqPattern"
            class="w-full"
            placeholder="\b(145|433|2|70).*-.*\b"
          />
        </div>
        <div class="field">
          <label for="associations">Monitored SOTA Associations</label>
          <p-multiselect
            inputId="associations"
            [options]="associationOptions"
            [(ngModel)]="selectedAssociations"
            name="associations"
            optionLabel="label"
            optionValue="value"
            placeholder="Select associations"
            styleClass="w-full"
            (ngModelChange)="onFormChange()"
          />
          <small class="hint">Dynamic list from SOTA summit data cache.</small>
          @if (validationError()) {
            <small class="hint" style="color:#ff6b6b">{{ validationError() }}</small>
          }
        </div>

        <div class="field">
          <label for="regions">Monitored Regions (optional, narrows APRS scope)</label>
          <p-multiselect
            inputId="regions"
            [options]="regionOptions"
            [(ngModel)]="selectedRegions"
            name="regions"
            optionLabel="label"
            optionValue="value"
            placeholder="All regions of selected associations"
            styleClass="w-full"
            (ngModelChange)="onFormChange()"
          />
          <small class="hint">Format: Association · Region. Empty = all regions of selected associations.</small>
        </div>
      </p-card>

      <!-- Activation Zone -->
      <p-card header="Activation Zone Thresholds" styleClass="config-card">
        <div class="field">
          <label>Max distance from summit: <strong>{{ activationZoneDistance }} m</strong></label>
          <p-slider
            [(ngModel)]="activationZoneDistance"
            name="distance"
            [min]="100"
            [max]="500"
            [step]="50"
            styleClass="w-full"
            (ngModelChange)="onFormChange()"
          />
        </div>
        <div class="field">
          <label>Max altitude below summit: <strong>{{ activationZoneAltitude }} m</strong></label>
          <p-slider
            [(ngModel)]="activationZoneAltitude"
            name="altitude"
            [min]="0"
            [max]="50"
            [step]="5"
            styleClass="w-full"
            (ngModelChange)="onFormChange()"
          />
        </div>
      </p-card>

      <div class="config-actions">
        <p-button
          type="submit"
          label="Save configuration"
          icon="pi pi-save"
          [loading]="saving()"
          [disabled]="!canSave()"
        />
        @if (hasChanges()) {
          <span class="unsaved-hint">You have unsaved changes</span>
        }
      </div>
    </form>
  }
</div>
