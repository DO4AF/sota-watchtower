<div class="login-page">
  <div class="login-card">
    <div class="login-card__header">
      <div class="login-card__logo">📡</div>
      <h1 class="login-card__title">SOTA Watchtower</h1>
      <p class="login-card__subtitle">Sign in to your account</p>
    </div>

    <form class="login-card__form" (ngSubmit)="login()" #loginForm="ngForm">
      @if (error) {
        <p-message severity="error" [text]="error" styleClass="login-error" />
      }

      <div class="form-field">
        <label for="email" class="form-label">Email address</label>
        <input
          id="email"
          type="email"
          pInputText
          [(ngModel)]="email"
          name="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
          class="form-input"
        />
      </div>

      <div class="form-field">
        <label for="password" class="form-label">Password</label>
        <p-password
          inputId="password"
          [(ngModel)]="password"
          name="password"
          [feedback]="false"
          [toggleMask]="true"
          placeholder="••••••••"
          autocomplete="current-password"
          styleClass="form-password"
          required
        />
      </div>

      <p-button
        type="submit"
        label="Sign in"
        icon="pi pi-sign-in"
        [loading]="loading"
        [disabled]="!email || !password"
        styleClass="login-btn"
        [fluid]="true"
      />
    </form>

    <div class="login-card__footer">
      <span class="login-card__footer-text">Ham radio summit monitoring · APRS · SOTA</span>
    </div>
  </div>
</div>
