<div class="map-page">
  <!-- Toolbar -->
  <div class="map-toolbar">
    <div class="map-toolbar__stats">
      <span class="stat-chip">
        <i class="pi pi-map-marker"></i>
        {{ summitCount() }} summits
      </span>
      <span class="stat-chip">
        <i class="pi pi-user"></i>
        {{ walkerCount() }} walkers
      </span>
    </div>

    <div class="map-toolbar__controls">
      <label class="trace-control">
        <span>Trace window:</span>
        <select class="trace-select"
          [value]="traceDurationHours()"
          (change)="traceDurationHours.set(+$any($event.target).value); onTraceDurationChange()">
          <option value="0.5">30 min</option>
          <option value="1">1 hour</option>
          <option value="2">2 hours</option>
          <option value="4">4 hours</option>
          <option value="8">8 hours</option>
          <option value="24">24 hours</option>
        </select>
      </label>
    </div>
  </div>

  <!-- Leaflet Map -->
  <div class="map-wrap">
    @if (loading()) {
      <div class="map-loading">
        <i class="pi pi-spin pi-spinner map-loading__icon"></i>
        <span>Loading…</span>
      </div>
    }

    <div id="sota-map"
      leaflet
      [leafletOptions]="mapOptions"
      (leafletMapReady)="onMapReady($event)"
      class="leaflet-map">
    </div>
  </div>

  <!-- Legend (bottom-right, absolute inside map-wrap) -->
  <div class="map-legend">
    <div class="map-legend__title">Summit Points</div>
    <div class="map-legend__gradient"></div>
    <div class="map-legend__labels">
      <span>1pt</span>
      <span>10pt</span>
    </div>
    <div class="map-legend__divider"></div>
    <div class="map-legend__title">Walkers</div>
    <div class="map-legend__item"><span class="ldot" style="background:#00e676"></span>&lt; 5 min</div>
    <div class="map-legend__item"><span class="ldot" style="background:#ffeb3b"></span>5–15 min</div>
    <div class="map-legend__item"><span class="ldot" style="background:#ff9800"></span>15–30 min</div>
    <div class="map-legend__item"><span class="ldot" style="background:#9e9e9e"></span>&gt; 30 min</div>
  </div>
</div>
